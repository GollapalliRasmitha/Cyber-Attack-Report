<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
</head>

<body>

<h2>Deepfake Reports Dashboard</h2>

<table border="1">
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Description</th>
<th>File</th>
<th>Date</th>

</tr>
</thead>

<tbody id="reportTable"></tbody>

</table>

<script>

fetch("http://127.0.0.1:5000/reports")
.then(res => res.json())
.then(data => {

let table = document.getElementById("reportTable");

data.reports.forEach(r => {

let row = `<tr>
<td>${r.id}</td>
<td>${r.name}</td>
<td>${r.description}</td>
<td>${r.file}</td>
<td>${r.date}</td>
</tr>`;

table.innerHTML += row;

});

});

</script>

</body>
</html>
